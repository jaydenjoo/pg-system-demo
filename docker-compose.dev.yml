services:
  db:
    ports:
      - "5432:5432"

  api:
    ports:
      - "4000:4000"
    environment:
      ALLOWED_ORIGINS: "http://localhost:3500,http://localhost:4000"

  web:
    ports:
      - "3500:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
      INTERNAL_API_URL: http://api:4000

  nginx:
    profiles:
      - disabled
