name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # 매주 월요일 06:00 UTC

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: SBOM Generation
        run: bash scripts/generate-sbom.sh
      - name: Dependency Audit
        run: |
          pnpm audit --audit-level=critical && echo "AUDIT_PASS=true" >> $GITHUB_ENV || echo "AUDIT_PASS=false" >> $GITHUB_ENV
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: reports/sbom/
          retention-days: 90
      - name: Fail on Critical
        if: env.AUDIT_PASS == 'false'
        run: |
          echo "::warning::Critical vulnerabilities found. Review pnpm audit output."
          # 현재는 warning만 (간접 의존성이므로), 직접 의존성 취약점 시 exit 1

  docker-scan:
    runs-on: ubuntu-latest
    needs: dependency-audit
    steps:
      - uses: actions/checkout@v4
      - name: Build API Image
        run: docker build -t pg-system-api:scan -f apps/api/Dockerfile .
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'pg-system-api:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
