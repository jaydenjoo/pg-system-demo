services:
  db:
    image: postgres:16-alpine
    container_name: pg-system-db
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pg-internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pg-system-api
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: development
      ALLOWED_ORIGINS: "http://localhost,https://localhost"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pg-internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pg-system-web
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pg-internal

  nginx:
    build:
      context: ./infra/nginx
    container_name: pg-system-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pg-internal

volumes:
  pg-data:

networks:
  pg-internal:
    driver: bridge
